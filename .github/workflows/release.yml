name: Release Builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build the Tauri app for each platform
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows
            bundle_glob: tauri/src-tauri/target/release/bundle/msi/*.msi
            extra_glob: tauri/src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            os_name: macos
            bundle_glob: tauri/src-tauri/target/release/bundle/dmg/*.dmg
            extra_glob: ""
          - platform: ubuntu-latest
            os_name: linux
            bundle_glob: tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            extra_glob: tauri/src-tauri/target/release/bundle/deb/*.deb

    name: Build — ${{ matrix.os_name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: tauri
        run: npm ci

      - name: Build Tauri bundle
        working-directory: tauri
        run: npm run tauri:build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: forgegen-${{ matrix.os_name }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_glob }}
            ${{ matrix.extra_glob }}

  # ---------------------------------------------------------------------------
  # Attach all artifacts to a release in liquid-releasing/forgegen-releases
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Compute release name
        id: relname
        run: |
          TAG="${GITHUB_REF_NAME}"
          STRIPPED="${TAG#v}"
          NAME="forgegen ${STRIPPED//-/ }"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to forgegen-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: liquid-releasing/forgegen-releases
          token: ${{ secrets.RELEASES_PAT }}
          name: ${{ steps.relname.outputs.name }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          append_body: true
          files: |
            artifacts/forgegen-windows/*.msi
            artifacts/forgegen-windows/*.exe
            artifacts/forgegen-macos/*.dmg
            artifacts/forgegen-linux/*.AppImage
            artifacts/forgegen-linux/*.deb
          body: |
            forgegen — generate funscripts from audio in seconds. Local
            desktop app, no cloud.

            ## Downloads
            - **Windows** — `forgegen_*_x64_en-US.msi` (installer) or
              `forgegen_*_x64-setup.exe` (NSIS) — install and launch.
            - **macOS** — `forgegen_*.dmg` — open, drag to Applications.
              First launch: right-click → Open (the build is unsigned).
            - **Linux** — `forgegen_*.AppImage` — `chmod +x` and run.
              `.deb` available for Debian/Ubuntu.

            Live per-stage progress (Extract / Load / Detect / Beats /
            Phrases / Sidecar) lights up dot-by-dot during runs.

            See the [website](https://forgegen.app) for a walkthrough.

  # ---------------------------------------------------------------------------
  # Notify forgegen-web so latest-version.json catches up
  # ---------------------------------------------------------------------------
  notify-web:
    name: Notify forgegen-web
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch release-published to forgegen-web
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASES_PAT }}
          repository: liquid-releasing/forgegen-web
          event-type: release-published
          client-payload: |
            { "tag": "${{ github.ref_name }}" }
