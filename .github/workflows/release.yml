name: Release Builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build the Tauri app for each platform
  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows
          - platform: macos-latest
            os_name: macos
          - platform: ubuntu-latest
            os_name: linux

    name: Build — ${{ matrix.os_name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: tauri
        run: npm ci

      - name: Build Tauri bundle
        working-directory: tauri
        run: npm run tauri:build

      # Tauri's bundle naming includes the version (forgegen_0.2.1_x64_en-US.msi)
      # which makes "latest" download URLs unstable across releases. Rename
      # everything into a flat dist-stable/ dir with predictable names so
      # forgegen.app's <a href="releases/latest/download/ForgeGen-Setup-..."
      # links keep working tag-to-tag.
      - name: Rename to stable filenames (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist-stable
          cp tauri/src-tauri/target/release/bundle/msi/*.msi  dist-stable/ForgeGen-Setup-windows.msi
          cp tauri/src-tauri/target/release/bundle/nsis/*.exe dist-stable/ForgeGen-Setup-windows.exe

      - name: Rename to stable filenames (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p dist-stable
          # macos-latest is Apple Silicon — the build is aarch64 only.
          # Suffix kept in the name so a future Intel matrix entry doesn't
          # collide on upload.
          cp tauri/src-tauri/target/release/bundle/dmg/*.dmg dist-stable/ForgeGen-Setup-macos-aarch64.dmg

      - name: Rename to stable filenames (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p dist-stable
          cp tauri/src-tauri/target/release/bundle/appimage/*.AppImage dist-stable/ForgeGen-Setup-linux.AppImage
          cp tauri/src-tauri/target/release/bundle/deb/*.deb           dist-stable/ForgeGen-Setup-linux.deb

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: forgegen-${{ matrix.os_name }}
          if-no-files-found: error
          path: dist-stable/*

  # ---------------------------------------------------------------------------
  # Attach all artifacts to a release in liquid-releasing/forgegen-releases
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Compute release name
        id: relname
        run: |
          TAG="${GITHUB_REF_NAME}"
          STRIPPED="${TAG#v}"
          NAME="forgegen ${STRIPPED//-/ }"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to forgegen-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: liquid-releasing/forgegen-releases
          token: ${{ secrets.RELEASES_PAT }}
          name: ${{ steps.relname.outputs.name }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          append_body: true
          # actions/upload-artifact@v4 strips the artifact name prefix from
          # the path, so the renamed files land flat under their named dir
          # (e.g. artifacts/forgegen-windows/ForgeGen-Setup-windows.msi).
          files: |
            artifacts/forgegen-windows/ForgeGen-Setup-windows.msi
            artifacts/forgegen-windows/ForgeGen-Setup-windows.exe
            artifacts/forgegen-macos/ForgeGen-Setup-macos-aarch64.dmg
            artifacts/forgegen-linux/ForgeGen-Setup-linux.AppImage
            artifacts/forgegen-linux/ForgeGen-Setup-linux.deb
          body: |
            forgegen — generate funscripts from audio in seconds. Local
            desktop app, no cloud.

            ## Downloads
            - **Windows** — `forgegen_*_x64_en-US.msi` (installer) or
              `forgegen_*_x64-setup.exe` (NSIS) — install and launch.
            - **macOS** — `forgegen_*.dmg` — open, drag to Applications.
              First launch: right-click → Open (the build is unsigned).
            - **Linux** — `forgegen_*.AppImage` — `chmod +x` and run.
              `.deb` available for Debian/Ubuntu.

            Live per-stage progress (Extract / Load / Detect / Beats /
            Phrases / Sidecar) lights up dot-by-dot during runs.

            See the [website](https://forgegen.app) for a walkthrough.

  # ---------------------------------------------------------------------------
  # Notify forgegen-web so latest-version.json catches up
  # ---------------------------------------------------------------------------
  notify-web:
    name: Notify forgegen-web
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch release-published to forgegen-web
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASES_PAT }}
          repository: liquid-releasing/forgegen-web
          event-type: release-published
          client-payload: |
            { "tag": "${{ github.ref_name }}" }
