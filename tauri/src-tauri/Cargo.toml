[package]
name = "forgegen"
version = "0.2.1-mvp3"
description = "forgegen — easy-button funscript/haptics generator"
authors = ["Liquid Releasing"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "forgegen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# `devtools` feature: bundles Microsoft Edge WebView2 devtools so users
# can inspect the page (F12 / Ctrl+Shift+I / right-click → Inspect).
# Enabled for debug AND release so dev builds always have it available.
tauri = { version = "2.1", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "fs", "time", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
md-5 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
